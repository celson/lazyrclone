[tools]
go = "1.26.8"

[tasks.default]
description = "Run tests and build lazyrclone"
alias = "all"
depends = ["test", "build"]

[tasks.build]
description = "Build the lazyrclone binary"
sources = ["**/*.go", "go.mod", "go.sum"]
outputs = ["bin/lazyrclone"]
run = """
mkdir -p bin
VERSION="0.1.0"
COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "none")
DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
LDFLAGS="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.Date=${DATE}"
go build -ldflags "${LDFLAGS}" -o bin/lazyrclone ./cmd/lazyrclone
"""

[tasks.run]
description = "Build and run lazyrclone TUI"
depends = ["build"]
raw = true
run = "./bin/lazyrclone"

[tasks.demo]
description = "Build and run lazyrclone in demo mode"
depends = ["build"]
raw = true
run = "./bin/lazyrclone --demo"

[tasks.test]
description = "Run all unit tests"
run = "go test -v ./..."

[tasks."test:race"]
description = "Run all unit tests with data race detector"
run = "go test -v -race ./..."

[tasks.install]
description = "Install lazyrclone binary to GOBIN"
run = """
VERSION="0.1.0"
COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "none")
DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
LDFLAGS="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.Date=${DATE}"
go install -ldflags "${LDFLAGS}" ./cmd/lazyrclone
"""

[tasks.clean]
description = "Remove build directory"
run = "rm -rf bin"
